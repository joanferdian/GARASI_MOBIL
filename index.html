<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GARANSI MOBIL - Katalog Pribadi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: #0f0f0f;
      color: #e5e5e5;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #1a1a1a, #111);
      border-bottom: 1px solid #333;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f59e0b;
      letter-spacing: 1px;
    }

    .logo span {
      color: #fff;
      font-weight: 400;
    }

    /* Search & Filter */
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      flex: 1;
      max-width: 600px;
    }

    .search-box {
      flex: 1;
      min-width: 180px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 40px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: #f59e0b;
    }

    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
    }

    select {
      padding: 10px 14px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: #f59e0b;
    }

    /* Buttons */
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #f59e0b;
      color: #000;
    }

    .btn-primary:hover {
      background: #d97706;
    }

    .btn-secondary {
      background: #272727;
      color: #fff;
      border: 1px solid #444;
    }

    .btn-secondary:hover {
      background: #333;
    }

    .btn-danger {
      background: #dc2626;
      color: #fff;
    }

    .btn-danger:hover {
      background: #b91c1c;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    /* Main */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 16px 20px;
      min-width: 140px;
    }

    .stat-card .label {
      font-size: 0.8rem;
      color: #999;
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f59e0b;
    }

    /* Product Grid */
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: #f59e0b;
    }

    .product-img {
      width: 100%;
      height: 180px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 12px;
    }

    .product-img .no-img {
      color: #555;
      font-size: 3rem;
    }

    .product-body {
      padding: 16px;
    }

    .product-category {
      font-size: 0.75rem;
      color: #f59e0b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .product-name {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #fff;
    }

    .product-desc {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .product-price {
      font-size: 1.15rem;
      font-weight: 700;
      color: #22c55e;
    }

    .product-stock {
      font-size: 0.85rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: #1e3a2f;
      color: #4ade80;
    }

    .product-stock.low {
      background: #3f1f
